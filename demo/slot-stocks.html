<html>
    <head>
        <title>bga-cards demo</title>
        <script>
            function define() {}
        </script>
        <link href="../node_modules/bga-animations/bga-animations.css" rel="stylesheet"></link>
        <script src="../node_modules/bga-animations/bga-animations.js" type="text/javascript"></script>

        <link href="../bga-cards.css" rel="stylesheet"></script>
        <script src="../bga-cards.js" type="text/javascript"></script>
        <link href="./demo.css" rel="stylesheet"></script>
        <script src="./common.js" type="text/javascript"></script>
        <script src="./manager.js" type="text/javascript"></script>
        <script src="./slot-stock.js" type="text/javascript"></script>
    </head>
    <body>
        <h1>Slot stocks</h1>

        <div class="flex">

            <div class="block">
                <h2>SlotStock</h2>
                <div id="slot-stock" class="slot-selection-stock"></div>
                <button onclick="swapSlotStockCards()">Swap cards</button>
                <div>
                    slot selection type :
                    <select onchange="slotSelectionTypeChange(this.value)">
                        <option value="none" selected>None</option>
                        <option value="single">single</option>
                        <option value="multiple">multiple</option>
                    </select>
                </div>
                <div>
                    selectable slots :
                    <select onchange="setSelectableSlots(this.value == 'all')">
                        <option value="all">all</option>
                        <option value="odd">odd slots indexes</option>
                    </select>
                </div>
                <div>
                    Last slot selection change event : <span id="slot-stock-last-selection-change"></span>
                </div>
                <div>
                    Last slot click event : <span id="slot-stock-last-click"></span>
                </div>
            </div>
        </div>

        <script>
            initCommon();
            initManager();
            initSlotStock();
        </script>
    </body>
</html>
